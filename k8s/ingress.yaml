apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routex-ingress
  namespace: routex
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: routex.internal
    http:
      paths:
      # NestJS Backend API paths
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /bookings
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /companies
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /drivers
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /fleet
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /trucks
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      - path: /wallet
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      # Socket.IO Routing
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: routex-backend-service
            port:
              number: 3001
      # Web Frontend default route
      - path: /
        pathType: Prefix
        backend:
          service:
            name: routex-frontend-service
            port:
              number: 3000
