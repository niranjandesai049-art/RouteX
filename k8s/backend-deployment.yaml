apiVersion: apps/v1
kind: Deployment
metadata:
  name: routex-backend
  namespace: routex
  labels:
    app: routex-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: routex-backend
  template:
    metadata:
      labels:
        app: routex-backend
    spec:
      containers:
      - name: backend
        image: routex-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: routex-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: routex-secrets
              key: jwt-secret
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: routex-secrets
              key: groq-api-key
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: routex-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: routex-config
              key: NODE_ENV
        resources:
          limits:
            cpu: "1.5"
            memory: 1536Mi
          requests:
            cpu: "500m"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
