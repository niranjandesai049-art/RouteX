apiVersion: v1
kind: Service
metadata:
  name: routex-postgres-headless
  namespace: routex
  labels:
    app: routex-postgres
spec:
  ports:
  - name: postgres
    port: 5432
  clusterIP: None
  selector:
    app: routex-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: routex-postgres
  namespace: routex
spec:
  serviceName: routex-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: routex-postgres
  template:
    metadata:
      labels:
        app: routex-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "routex"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: routex-secrets
              key: jwt-secret # Reuse password or create explicit key
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "250m"
            memory: 512Mi
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "routex"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "routex"]
          initialDelaySeconds: 15
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
