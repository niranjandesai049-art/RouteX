apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: routex-backend-hpa
  namespace: routex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: routex-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: routex-frontend-hpa
  namespace: routex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: routex-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
