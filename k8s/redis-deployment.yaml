apiVersion: apps/v1
kind: Deployment
metadata:
  name: routex-redis
  namespace: routex
  labels:
    app: routex-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routex-redis
  template:
    metadata:
      labels:
        app: routex-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: "100m"
            memory: 256Mi
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
