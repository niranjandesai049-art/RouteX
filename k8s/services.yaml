apiVersion: v1
kind: Service
metadata:
  name: routex-backend-service
  namespace: routex
spec:
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: routex-backend
---
apiVersion: v1
kind: Service
metadata:
  name: routex-frontend-service
  namespace: routex
spec:
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: routex-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: routex-postgres-service
  namespace: routex
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: routex-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: routex-redis-service
  namespace: routex
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: routex-redis
