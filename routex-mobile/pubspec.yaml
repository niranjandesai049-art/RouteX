name: routex_mobile
description: RouteX - India's AI-Powered Digital Freight Marketplace (Driver & Truck Owner App)
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^10.0.0

  # State Management
  flutter_riverpod: ^2.4.0

  # HTTP & WebSockets
  dio: ^5.3.0
  socket_io_client: ^2.0.3+1

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  location: ^5.0.3

  # UI & Design
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  intl: ^0.18.1

  # Local Storage & Utilities
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  signature: ^5.4.1
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
