version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: routex-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secureproductionpasswordchangeme
      POSTGRES_DB: routex
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routex-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./routex-backend
      dockerfile: Dockerfile
    container_name: routex-backend-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:secureproductionpasswordchangeme@postgres:5432/routex?sslmode=disable
      - PORT=3001
      - JWT_SECRET=production_super_secret_jwt_key_that_must_be_rotated_frequent
      - GROQ_API_KEY=gsk_production_placeholder_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  frontend:
    build:
      context: ./routex-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost
    container_name: routex-frontend-prod
    restart: always
    environment:
      - PORT=3000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  nginx:
    image: nginx:1.25-alpine
    container_name: routex-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
