version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: routex-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: developmentpassword
      POSTGRES_DB: routex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routex-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./routex-backend
      dockerfile: Dockerfile.dev
    container_name: routex-backend-dev
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:developmentpassword@postgres:5432/routex?sslmode=disable
      - PORT=3001
      - JWT_SECRET=development_jwt_secret_must_be_at_least_32_characters_long
      - GROQ_API_KEY=gsk_development_placeholder_key
    volumes:
      - ./routex-backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./routex-web
      dockerfile: Dockerfile.dev
    container_name: routex-frontend-dev
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./routex-web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
